[package]
name = "native_svg_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
color = "=0.3.3"
cssparser = "=0.37.0"
cssparser-color = { path = "vendor/cssparser-color" }
resvg = "=0.47.0"
usvg = "=0.47.0"
tiny-skia = "=0.12.0"
rustler = "=0.33.0"
svgtypes = "=0.16.1"
pdf-writer = "=0.12.1"
ttf-parser = "=0.25.1"
hayro = { version = "=0.8.0", default-features = false }

regress = { path = "vendor/regress", default-features = false, features = ["std", "utf16"] }
url = "=2.5.8"

[[bin]]
name = "native_form_values"
path = "src/form_values.rs"

[profile.release]
lto = true
codegen-units = 1

[patch.crates-io]
usvg = { path = "vendor/usvg-0.47.0" }
