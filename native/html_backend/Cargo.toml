[package]
name = "native_html_backend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
color = "=0.3.3"
cssparser = "=0.37.0"
cssparser-color = { path = "vendor/cssparser-color" }
rustler = "=0.33.0"
regress = { path = "vendor/regress", default-features = false, features = ["std", "utf16"] }
url = "=2.5.8"
unicode-linebreak = "=0.1.5"

[[bin]]
name = "native_form_values"
path = "src/form_values.rs"

[profile.release]
lto = true
codegen-units = 1
