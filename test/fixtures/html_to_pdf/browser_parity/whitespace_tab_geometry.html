<!doctype html>
<html><head><meta charset="utf-8"><style>
@page{size:600pt 120pt;margin:0}
html,body{margin:0;padding:0}
body{font-family:'DejaVu Sans Mono';font-size:10pt;line-height:14pt}
.sample{position:absolute;top:8pt;width:138pt;border:0.75pt solid #445566;padding:3pt;box-sizing:border-box}
.label{font-family:'DejaVu Sans';font-size:8pt;line-height:12pt;margin:0 0 3pt}
p{margin:0}
.tabs{white-space:pre;tab-size:4}
#block{left:8pt}#table{left:156pt}#flex{left:304pt}#grid{left:452pt}
td{padding:0}
#table .tabs{tab-size:2.5}
#flex .tabs{tab-size:20pt}
#grid .tabs{white-space:break-spaces;width:31pt}
.hanging{white-space:pre-wrap;text-align:right;width:40pt;margin-top:8pt}
.cjk{font-family:'CJK Ruby Fixture';font-size:12pt;line-height:18pt;margin-top:8pt}
</style></head><body>
<section class="sample" id="block"><p class="label">Block stops</p><p class="tabs">A	B	C</p><p class="hanging">A    BBBB</p></section>
<section class="sample" id="table"><p class="label">Table stops</p><table><tr><td><p class="tabs">A	B	C</p></td></tr></table><p class="cjk" lang="ja">京都
東京</p></section>
<section class="sample" id="flex"><p class="label">Flex stops</p><div style="display:flex"><p class="tabs">A	B	C</p></div></section>
<section class="sample" id="grid"><p class="label">Grid wrap</p><div style="display:grid;grid-template-columns:100pt"><p class="tabs">AAAA 	B</p></div></section>
</body></html>
