<!doctype html>
<html><head><meta charset="utf-8"><style title="Preferred">
@page { size: 280px 180px; margin: 8px; }
html,body { margin:0; padding:0; font-family:"DejaVu Sans"; font-size:12px; line-height:18px; }
p { margin:0; color:green; }
svg { vertical-align:top; width:24px; height:12px; }
</style></head><body>
<p>Before SVG stylesheet</p>
<svg width="24" height="12"><style>rect{fill:red}p{color:blue}</style><rect width="24" height="12" /></svg>
<p>Shared document styles</p>
<svg width="24" height="12"><rect width="24" height="12" /></svg>
<p>After sibling SVG</p>
<style type="text/plain">p{color:red}</style>
</body></html>
