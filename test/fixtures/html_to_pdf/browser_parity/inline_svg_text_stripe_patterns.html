<!doctype html>
<html><head><meta charset="utf-8"><style>
@page {size:420px 240px;margin:12px;}

<svg viewBox="0 0 380 180"><defs>

<pattern id="inherited" href="#vertical" patternTransform="rotate(-8)"/>
</defs><text x="8" y="38" fill="url(#vertical)">Stripe office Ω</text>
<text x="8" y="88" fill="url(#horizontal)">BBox café Ω</text>

</svg></body></html>
