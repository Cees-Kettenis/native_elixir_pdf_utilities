<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @page { size: 420pt 180pt; margin: 0; }
      html, body { margin: 0; padding: 0; }
      body { font-family: "DejaVu Sans"; font-size: 12pt; line-height: 24pt; }
      p { margin: 0; }
      .lower { text-transform: lowercase; }
      .upper { text-transform: uppercase; }
      .cap { text-transform: capitalize; }
    </style>
  </head>
  <body lang="lt">
    <p class="lower">I&#x301; J&#x300; &#x12E;&#x303;</p>
    <p class="lower">&#xCC; &#xCD; &#x128;</p>
    <p class="lower"><span>I&#x301;</span> <span>J&#x300;</span></p>
    <p class="upper">i<span>&#x307;</span> j<span>&#x307;</span> &#x12F;<span>&#x307;</span></p>
    <p class="cap">i<span>&#x307;</span></p>
    <p class="lower" lang="en">I&#x301; J&#x300; &#x12E;&#x303;</p>
  </body>
</html>
