      main { padding: 16pt; }
      .row, .column { display: flex; gap: 8pt; width: 240pt; margin-bottom: 16pt; background: #eef2ff; }
      .row { height: 60pt; }
      .column { flex-direction: column; height: 140pt; }
      img { flex: 0 0 auto; width: 40pt; height: 20pt; }

      .automatic { flex: 0 0 auto; background: #fed7aa; }
      .row .automatic { width: 40pt; }
      .column .automatic { height: 20pt; }
