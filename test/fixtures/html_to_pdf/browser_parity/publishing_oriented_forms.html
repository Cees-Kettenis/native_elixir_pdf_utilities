<!doctype html><html><head><style>
@page { size: 200pt 150pt; margin: 18pt; page-orientation: rotate-left }
@page :first { page-orientation: rotate-right }
html, body { margin: 0; font: 12pt/15pt "DejaVu Sans" }
section + section { break-before: page }
input { display: block; appearance: none; box-sizing: border-box; width: 120pt; height: 30pt; margin: 0; padding: 3pt; border: 1px solid #305e84; border-radius: 0; background: #eef4f8; color: #172033; font: 12pt "DejaVu Sans" }
</style></head><body>
<section><input name="first" value="Clockwise"></section>
<section><input name="second" value="Counterclockwise"></section>
</body></html>
