<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>System font inheritance parity</title>
    <style>
      @page { size: letter; margin: 0; }
      html {
        font-family: sans-serif;
        font-size: 14pt;
      }
      body {
        margin: 0;
      }
      .card {
        width: 360pt;
        margin: 36pt;
        padding: 18pt;
        border: 2pt solid #2563eb;
        background-color: #eff6ff;
        box-sizing: border-box;
      }
      p {
        margin: 0;
        color: #1e3a8a;
      }
      table {
        width: 100%;
        margin-top: 12pt;
        border-collapse: collapse;
        table-layout: fixed;
      }
      th, td {
        width: 50%;
        padding: 4pt;
        border: 1pt solid #93c5fd;
      }
      th {
        font-weight: bold;
        text-align: left;
      }
      .amount {
        text-align: right;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p>The paragraph inherits the installed sans-serif face.</p>
      <table>
        <thead><tr><th>Item</th><th class="amount">Amount</th></tr></thead>
        <tbody><tr><td>System metrics</td><td class="amount">1,234.56</td></tr></tbody>
      </table>
    </div>
  </body>
</html>
