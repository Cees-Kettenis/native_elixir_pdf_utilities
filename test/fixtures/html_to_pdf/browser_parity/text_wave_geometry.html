<!doctype html><html><head><meta charset="utf-8"><style>@page{size:600pt 120pt;margin:0}html,body{margin:0;padding:0}

#text_wave_geometry .sample{position:absolute;top:8pt;width:180pt;padding:3pt;border:0.75pt solid #445566;box-sizing:border-box}
#text_wave_geometry .sample:nth-child(1){left:9pt}#text_wave_geometry .sample:nth-child(2){left:207pt}#text_wave_geometry .sample:nth-child(3){left:405pt}
#text_wave_geometry .label{font:8pt/12pt 'DejaVu Sans';margin:0 0 3pt}
#text_wave_geometry .text{font:18pt/32pt 'DejaVu Sans';margin:0;text-decoration-style:wavy;text-decoration-thickness:0.75pt;text-decoration-color:#336699}
</style></head><body>
<!-- Wavy strokes use the same capture and fonts, including split and bidi phases. -->
<section id="text_wave_geometry" style="position:absolute;left:0pt;top:0pt;width:600pt;height:120pt;box-sizing:border-box">
<section class="sample"><p class="label">Wavy underline / bidi</p><p class="text" style="text-decoration-line:underline">ABC<span style="color:red">DEF</span></p><p class="text" dir="rtl" style="text-decoration-line:underline">אב<span style="color:red">גד</span></p></section>
<section class="sample"><p class="label">Wavy overline</p><p class="text" style="text-decoration-line:overline">ABCDEF</p><p class="text" style="text-decoration-line:underline">gyp</p></section>
<section class="sample"><p class="label">Wavy strike</p><p class="text" style="text-decoration-line:line-through">ABCDEF</p><p class="text" style="text-decoration-line:underline;text-decoration-skip-ink:none">gyp</p></section>
</section>
</body></html>
