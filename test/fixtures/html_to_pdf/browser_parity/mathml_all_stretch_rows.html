<!doctype html>
<html><head><meta charset="utf-8"><style>
@page {size:360pt 450pt;margin:0}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:12pt;line-height:18pt}
body {padding:12pt}
p {margin:0 0 8pt}
math {font-family:"STIX Two Math";font-size:20pt}
</style></head><body>
<p>All stretchy siblings</p>
<math display="block"><mo>(</mo><mo style="font-size:40pt">)</mo></math>
<p>Wrapped operator and stretchy invisible operator</p>
<math display="block"><mrow><mo lspace="3pt" rspace="7pt">(</mo></mrow><mo stretchy="true">&#x2062;</mo><mo style="font-size:40pt">)</mo></math>
<p>Empty ordinary group</p>
<math display="block"><mo>(</mo><mrow></mrow><mo style="font-size:40pt">)</mo></math>
<p>Ordinary invisible operator</p>
<math display="block"><mo>(</mo><mo>&#x2062;</mo><mo style="font-size:40pt">)</mo></math>
<p>Ordinary space target</p>
<math display="block"><mo>(</mo><mspace width="4pt" height="28pt" depth="8pt"/><mo>)</mo></math>
<p>After rows.</p>
</body></html>
