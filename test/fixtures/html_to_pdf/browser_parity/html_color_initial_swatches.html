<!doctype html><html lang=en-US><head><style>
@page {size:300pt 360pt;margin:0;}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:10.5pt;line-height:15pt;}
body {padding:12pt;}p {margin:0 0 9pt;}input {display:block;}
.wide {width:78pt;height:30pt;}.rounded {border-radius:3pt;width:78pt;height:30pt;}
</style></head><body>
<p>Default black<input type=color name=default></p>
<p>Uppercase hex<input type=color value="#ABCDEF"></p>
<p>Named red<input type=color value=red></p>
<p>Opaque rgba<input type=color value="rgba(0,128,255,0.5)" class=wide></p>
<p>Disabled green<input type=color value="#008000" disabled class=wide></p>
<p>Rounded swatch<input type=color value="#8040c0" class=rounded></p>
<p>After initial swatches</p>
</body></html>
