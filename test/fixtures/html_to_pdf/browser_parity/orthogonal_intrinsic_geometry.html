<!doctype html><html><head><meta charset="utf-8"><style>@page{size:600pt 60pt;margin:0}html,body{margin:0;padding:0}
#orthogonal_intrinsic_geometry .sizing{position:absolute;top:0pt;width:140pt;height:54pt;font:8pt/10pt 'DejaVu Sans'}
#orthogonal_intrinsic_geometry .sizing .caption{height:12pt}
#orthogonal_intrinsic_geometry .sizing .probe{vertical-align:top;grid-template-columns:1fr;writing-mode:vertical-rl;text-orientation:sideways;font:12pt/12pt 'Authored Vertical';border:0.75pt solid #8899aa}
</style></head><body>
<section id="orthogonal_intrinsic_geometry" style="position:absolute;left:0pt;top:0pt;width:600pt;height:60pt;box-sizing:border-box">
<!-- Intrinsic orthogonal sizing reuses the existing authored face and shared capture.
     ZWSP supplies the same explicit word boundary without another font for a space glyph. -->
<section class="sizing" style="left:9pt"><div class="caption">Min grid</div><span class="probe" style="display:inline-grid;inline-size:min-content">AB&#8203;CD</span></section>
<section class="sizing" style="left:159pt"><div class="caption">Max flex</div><span class="probe" style="display:inline-flex;inline-size:max-content">AB&#8203;CD</span></section>
<section class="sizing" style="left:309pt"><div class="caption">Fit grid</div><span class="probe" data-intrinsic-reference="18pt" style="display:inline-grid;inline-size:fit-content(18pt)">AB&#8203;CD</span></section>
<section class="sizing" style="left:459pt"><div class="caption">Calculated</div><span class="probe" style="display:inline-flex;inline-size:calc(9pt + 9pt)">AB&#8203;CD</span></section>
</section>
</body></html>
