<!doctype html><html><head><meta charset="utf-8"><style>@page{size:600pt 120pt;margin:0}html,body{margin:0;padding:0}
#text_shadow_geometry .sample{position:absolute;top:8pt;width:180pt;padding:3pt;border:0.75pt solid #445566;box-sizing:border-box}
#text_shadow_geometry .sample:nth-child(1){left:9pt}#text_shadow_geometry .sample:nth-child(2){left:207pt}#text_shadow_geometry .sample:nth-child(3){left:405pt}
#text_shadow_geometry .label{font:8pt/12pt 'DejaVu Sans';margin:0 0 3pt}
#text_shadow_geometry .text{font:18pt/32pt 'DejaVu Sans';margin:0}
</style></head><body>
<section id="text_shadow_geometry" style="position:absolute;left:0pt;top:0pt;width:600pt;height:120pt;box-sizing:border-box">
<section class="sample"><p class="label">Ordered shadows / split text</p><p class="text" style="text-shadow:1.5pt 1.5pt blue,-1.5pt -1.5pt red">ABC<span style="color:#338833">DEF</span></p></section>
<section class="sample"><p class="label">Blurred selected glyph outlines</p><p class="text" style="text-shadow:2pt 3pt 2pt rgba(0,0,255,0.5)">ABCDEF</p></section>
<section class="sample"><p class="label">Decoration shadow / hidden ink</p><p class="text" style="text-shadow:2pt 2pt red;text-decoration:underline 0.75pt">ABC<span style="visibility:hidden">H</span>DEF</p></section>
</section></body></html>
