<!doctype html>
<html><head><meta charset="utf-8"><style>
@page { size: 420px 490px; margin: 12px; }
html, body { margin: 0; padding: 0; font-family: "DejaVu Sans"; font-size: 12px; line-height: 16px; color: #174a86; }
p { margin: 0; }
svg { vertical-align: baseline; }
.panel { display: block; width: 360px; height: 88px; }
.ink { fill: #dd8800; }
#winner { fill: currentColor; }
svg .ink { stroke: #222; stroke-width: 2; }
.percent-host { width: 360px; height: 70px; }
</style></head><body>
<p>Inline baseline Ω <svg width="40" height="20"><rect width="40" height="20" fill="#168250" /></svg> café after</p>
<p>Shapes and host cascade</p>
<svg class="panel" viewBox="0 0 360 88" fill="#a03333">
 <rect id="winner" class="ink" x="4" y="4" width="48" height="40" rx="8" fill="red" />
 <circle class="ink" cx="90" cy="25" r="21" style="fill:#dd8800" />
 <ellipse cx="150" cy="25" rx="29" ry="18" fill="currentColor" />
 <line x1="192" y1="10" x2="237" y2="40" stroke="#168250" stroke-width="6" stroke-linecap="round" />
 <polyline points="248,40 270,7 292,40" fill="none" stroke="#a03333" stroke-width="4" stroke-linejoin="round" />
 <polygon points="304,7 352,7 328,42" fill="#168250" />
 <g opacity="0.5"><rect x="8" y="52" width="64" height="28" fill="#168250" /><rect x="40" y="60" width="64" height="24" fill="#174a86" /></g>
 <rect x="118" y="52" width="60" height="28" visibility="hidden" />
 <g visibility="hidden"><rect x="192" y="52" width="64" height="28" visibility="visible" fill="currentColor" /></g>
 <rect x="274" y="52" width="64" height="28" style="display:none" />
</svg>
<p>Paths, strokes and affine artwork</p>
<svg class="panel" viewBox="0 0 360 88">
 <path d="M4 4 H76 V78 H4 Z M22 22 V60 H58 V22 Z" fill="#174a86" fill-rule="evenodd" />
 <path d="M88 70 C90 0 118 0 124 40 S155 78 164 20 Q182 0 190 35 T220 45 A18 12 25 0 1 254 60" fill="none" stroke="#a03333" stroke-width="4" stroke-linecap="round" stroke-dasharray="10 4" />
 <g transform="translate(285 43) rotate(22) skewX(12) scale(-1 1)"><rect x="-24" y="-22" width="48" height="44" fill="#168250" /><path d="m-16 0 h32 v12 h-32 z" fill="#dd8800" /></g>
 <rect x="330" y="4" width="21" height="76" fill="#174a86" shape-rendering="crispEdges" />
</svg>
<p>Nested viewports, slice and percentages</p>
<svg class="panel" viewBox="0 0 360 88">
 <svg x="4" y="4" width="28%" height="80%" viewBox="0 0 40 40" preserveAspectRatio="xMinYMax slice"><circle cx="20" cy="20" r="25" fill="#168250" /><rect x="14" y="0" width="12" height="40" fill="#dd8800" /></svg>
 <svg x="126" y="4" width="96" height="70" viewBox="10 20 40 40" preserveAspectRatio="none"><rect x="10" y="20" width="40" height="40" fill="#174a86" /><circle cx="30" cy="40" r="12" fill="#dd8800" /></svg>
 <svg x="248" y="4" width="96" height="70" viewBox="0 0 40 40" preserveAspectRatio="xMaxYMin meet" opacity="0.5"><rect width="40" height="40" fill="#a03333" /></svg>
</svg>
<div class="percent-host"><svg style="display:block;width:50%;height:50%" viewBox="0 0 180 35"><rect width="180" height="35" fill="currentColor" /></svg><p>Percentage host survived</p></div>
<p><svg width="0" height="30"><rect width="100" height="100" fill="red" /></svg>Zero area survived</p>
<p>End of geometry</p>
</body></html>
