<!doctype html>
<html><head><meta charset="utf-8"><style>
@page {size:360pt 350pt;margin:0}
html {margin:0;padding:0;font-family:"DejaVu Sans";font-size:12pt;line-height:24pt}
body {margin:0;padding:12pt;font-size:14pt;line-height:28pt}
p {margin:0 0 12pt}
math {font-family:"STIX Two Math";font-size:20pt}
</style></head><body>
<p>Arithmetic <math><mn>1</mn><mo lspace="calc(0.5em + 2px)" rspace="calc((1em - 4pt) / 2)">+</mo><mn>2</mn></math>.</p>
<p>Comparisons <math><mn>3</mn><mo lspace="min(1ch, 10pt)" rspace="clamp(2pt, 0.5cap, 12pt)">=</mo><mn>4</mn></math>.</p>
<p>Root context <math><mn>5</mn><mo lspace="calc(1rch + 0.25rlh)" rspace="calc(0.5rcap + 1rex)">+</mo><mn>6</mn></math>.</p>
<p>Viewport <math><mn>7</mn><mo lspace="calc(1vw + 1vh)" rspace="max(1vmin, 2px)">+</mo><mn>8</mn></math>.</p>
<p>Percent space <math><mn>9</mn><mo lspace="calc(150% + 2pt)" rspace="min(200%, 10pt)">+</mo><mn>0</mn></math>.</p>
<p>Size constraints <math><mo minsize="calc(150% + 4pt)" maxsize="max(200%, 30pt)">(</mo><mspace width="4pt" height="25pt" depth="7pt"/><mo minsize="min(200%, 40pt)" maxsize="clamp(20pt, 250%, 60pt)">)</mo></math>.</p>
</body></html>
