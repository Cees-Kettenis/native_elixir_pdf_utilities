<!doctype html><html><head><style>
@page {size:264pt 300pt;margin:0;}
html,body {margin:0;padding:0;}
body {padding:12pt;font-family:"DejaVu Sans";font-size:10.5pt;line-height:13.5pt;}
input {display:block;width:180pt;box-sizing:border-box;border:1px solid #777777;background:white;padding:1.5pt 3pt;margin:0 0 6pt;font-family:"DejaVu Sans";font-size:10.5pt;line-height:13.5pt;}
input[type="password"][value^="A"] {color:red;}
input[disabled] {color:#666666;background:#f4f4f4;}
</style></head><body>
<input type="password" name="ascii" value="ABC">
<input type="PASSWORD" name="sanitized" value="A&#13;B&#10;C">
<input type="password" name="spaces" value=" A B ">
<input type="password" name="unicode" value="Aé🦊">
<input type="password" name="empty" value="">
<input type="password" readonly="false" name="readonly" value="Readonly">
<input type="password" disabled="false" name="disabled" value="Disabled">
<input type="password" value="👩‍👩‍👧‍👦🇲🇾é">
<p>All password cases remain masked.</p>
</body></html>
