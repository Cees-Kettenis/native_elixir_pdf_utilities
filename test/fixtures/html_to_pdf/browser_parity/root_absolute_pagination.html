<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @page { size: 200pt 100pt; margin: 0; }
      html, body { margin: 0; padding: 0; }
      .first {
        width: 200pt;
        height: 70pt;
        background: #fecaca;
        page-break-after: always;
      }
      .second { width: 200pt; height: 70pt; background: #bbf7d0; }
      .root-marker {
        position: absolute;
        left: 12pt;
        top: 10pt;
        width: 48pt;
        height: 14pt;
        background: #2563eb;
      }
    </style>
  </head>
  <body>
    <div class="first"></div>
    <div class="second"></div>
    <div class="root-marker"></div>
  </body>
</html>
