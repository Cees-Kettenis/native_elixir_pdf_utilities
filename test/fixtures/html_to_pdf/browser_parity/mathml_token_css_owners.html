<!doctype html><html><head><meta charset="utf-8"><style>
@page {size:360pt 300pt;margin:0}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:10pt;line-height:16pt}
body {padding:12pt}
p {margin:0 0 14pt}
math {font-family:"STIX Two Math";font-size:16pt}
.size {width:min(44pt,60pt);height:30pt;box-sizing:border-box;padding:3pt;border:1px solid #1565c0;background:#fff59d}
.clip {position:relative;left:3pt;top:2pt;width:12pt;height:16pt;padding:2pt;overflow:hidden;background:#fff59d}
.native {width:80pt;box-sizing:border-box;padding:3pt;border:1px solid #1565c0;background:#e3f2fd}
</style></head><body>
<p>Token sizes <math><mi class="size">12</mi><mn class="size">34</mn><mtext class="size">56</mtext><ms class="size">78</ms></math></p>
<p>Token clip <math><mtext class="clip">123456</mtext><mn>9</mn></math></p>
<p>Native width <math><mtext class="native"><span style="display:block;width:50%;font-family:DejaVu Sans;font-size:12pt;line-height:18pt;white-space:normal;background:#fff59d">Alpha beta gamma</span></mtext><mn>2</mn></math></p>
<p>SVG atom <math><mtext style="width:80pt;padding:2pt;background:#e3f2fd"><span style="font-family:DejaVu Sans;font-size:10pt">Label <math><mfrac><mn>1</mn><mn>2</mn></mfrac></math></span><svg width="24" height="18" viewBox="0 0 24 18"><rect width="24" height="18" fill="#64b5f6"/><text x="2" y="12" font-family="DejaVu Sans" font-size="10">Q</text></svg></mtext><mn>4</mn></math></p>
<p>Percentage block</p><div style='width:200pt'><math display='block'><mtext style='width:calc(50% + 10pt);background:#fff59d'>12</mtext></math></div>
</body></html>
