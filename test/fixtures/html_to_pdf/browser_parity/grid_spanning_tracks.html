<!doctype html>
<html><head><meta charset="UTF-8"><style>
@page { size: 300pt 600pt; margin: 0; }
html, body { margin: 0; font-family: 'DejaVu Sans'; font-size: 12pt; line-height: 12pt; }
section { margin-bottom: 10pt; }
</style></head><body>
<section>
<div style="display:grid;width:100pt;grid-template-columns:100pt;grid-template-rows:auto auto">
  <div style="grid-row:1 / 3;height:40pt;background:red"></div>
</div><div style="height:10pt;width:100pt;background:blue"></div>
</section>
<section style="display:grid;grid-template-columns:auto auto;justify-content:start">
  <div style="grid-column:1 / 3;width:80pt;height:20pt;background:red"></div>
  <div style="grid-row:2;grid-column:1;height:10pt;background:blue"></div>
  <div style="grid-row:2;grid-column:2;height:10pt;background:lime"></div>
</section>
<section>
<div style="display:grid;width:100pt;grid-template-columns:100pt;grid-template-rows:minmax(auto,15pt) auto;row-gap:5pt">
  <div style="grid-row:1 / 3;height:40pt;background:red"></div>
  <div style="grid-row:1;grid-column:1;background:blue"></div>
</div><div style="height:10pt;width:100pt;background:lime"></div>
</section>
<section>
<div style="display:grid;width:100pt;grid-template-columns:100pt;grid-template-rows:1fr 2fr;row-gap:5pt">
  <div style="grid-row:1 / 3;height:40pt;background:red"></div>
</div><div style="height:10pt;width:100pt;background:blue"></div>
</section>
<section style="display:grid;width:100pt;grid-template-columns:100pt;grid-template-rows:1fr 1fr 1fr">
<div style="grid-row:1 / 3;height:60pt"></div><div style="grid-row:1 / 4;height:90pt"></div>
<div style="grid-row:1;grid-column:1;background:red"></div><div style="grid-row:2;grid-column:1;background:blue"></div><div style="grid-row:3;grid-column:1;background:lime"></div>
</section>
<section style="display:grid;width:100pt;grid-template-columns:100pt;grid-template-rows:minmax(100pt,1fr) 1fr">
<div style="grid-row:1 / 3;height:150pt"></div><div style="grid-row:1;grid-column:1;background:red"></div><div style="grid-row:2;grid-column:1;background:blue"></div>
</section>
</body></html>
