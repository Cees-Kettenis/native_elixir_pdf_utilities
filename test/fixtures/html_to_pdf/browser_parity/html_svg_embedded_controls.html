<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:360px 320px;margin:0}body{margin:0;font-family:Arial;font-size:14px}
input{box-sizing:border-box;font-family:Arial;font-size:13.3333px;margin:0;padding:1px 2px;border:2px solid #777;border-radius:0;background:#fff;color:#111}
svg{display:block}iframe{display:block;border:0;width:140px;height:60px}
</style></head><body><form id="owner"><input name="parent" value="Root value" style="display:block;width:140px;height:24px">
<svg width="320" height="100"><foreignObject x="12" y="12" width="180" height="70"><div xmlns="http://www.w3.org/1999/xhtml"><input name="local" form="owner" value="Native value" style="display:block;width:140px;height:24px"></div></foreignObject></svg>
<svg width="320" height="100"><foreignObject x="20" y="15" width="180" height="70" transform="rotate(15 80 40)"><div xmlns="http://www.w3.org/1999/xhtml"><input name="affine" form="owner" value="Rotated value" style="display:block;width:140px;height:24px"></div></foreignObject></svg>
</form></body></html>
