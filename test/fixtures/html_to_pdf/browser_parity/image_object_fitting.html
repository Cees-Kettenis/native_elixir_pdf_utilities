<!doctype html>
<html>

    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: "DejaVu Sans", Arial, sans-serif; }
      .sheet { width: 595pt; padding: 24pt; box-sizing: border-box; }

      .frame {
        width: 140pt;
        height: 100pt;
        border: 2pt solid #1f2937;
        background: #e5e7eb;
      }
      .contain { object-fit: contain; object-position: left top; }
      .cover { object-fit: cover; object-position: 75% 25%; }
    </style>
  </head>

</html>
