<!doctype html><html><head><style>
@page {size:360pt 300pt;margin:12pt;}
html,body{margin:0;padding:0;font-family:"DejaVu Sans";font-size:12pt;line-height:15pt;}
.panel{width:90pt;height:39pt;margin:15pt 0 15pt 36pt;border:1.5pt solid #305e84;background:#eaf0f5;padding:3pt;}
a{color:#162e42;text-decoration:none;}
</style></head><body>
<div class="panel" style="transform:rotate(12deg);transform-origin:25% 75%"><a href="https://example.com/rotate">Rotated source</a></div>
<div class="panel" style="transform:translate(calc(10% + .5em),3pt) skewX(12deg);transform-origin:right bottom">Skewed source</div>
<div class="panel" style="transform:scaleX(-1);transform-origin:50% 50%">Reflected source</div>
<p style="margin:0">Following actual flow</p>
</body></html>
