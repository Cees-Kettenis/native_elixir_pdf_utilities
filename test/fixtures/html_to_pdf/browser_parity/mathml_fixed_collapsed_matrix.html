<!doctype html><html><head><meta charset="utf-8"><style>
@page {size:420pt 360pt;margin:0}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:10pt;line-height:16pt}
body {padding:12pt}
p {margin:0 0 12pt;line-height:44pt}
math {font-family:"STIX Two Math";font-size:18pt}
mn {math-depth:0;font-size:18pt}
.box {padding:3pt;border:1pt solid #1565c0;background:#fff59d}
</style></head><body>
<p>Fixed <math><mtable style="table-layout:fixed;width:180pt;border-spacing:3pt"><mtr><mtd style="width:40pt;background:#fff59d"><mn>1</mn></mtd><mtd><mfrac><mn>2</mn><mn>3</mn></mfrac></mtd><mtd><mn>456</mn></mtd></mtr><mtr><mtd columnspan="2"><msqrt><mn>7</mn></msqrt></mtd><mtd><mn>8</mn></mtd></mtr></mtable></math></p>
<p>Collapsed <math><mtable style="border-collapse:collapse;border:2pt solid #1565c0"><mtr style="border:1pt solid red"><mtd class="box" rowspan="2"><mn>1</mn></mtd><mtd style="border:3pt solid #1565c0;padding:3pt"><mfrac><mn>2</mn><mn>3</mn></mfrac></mtd></mtr><mtr><mtd style="border:1pt solid red;padding:3pt"><mn>4</mn></mtd></mtr></mtable></math></p>
<p>Cell clip <math><mtable><mtr><mtd style="position:relative;left:4pt;width:18pt;height:18pt;overflow:hidden;background:#fff59d"><mn>5678</mn></mtd><mtd><mn>9</mn></mtd></mtr></mtable></math></p>
</body></html>
