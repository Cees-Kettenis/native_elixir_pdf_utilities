<!doctype html><html lang=en-US><head><meta charset=utf-8><style>
@page {size:420pt 480pt;margin:0;}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:10.5pt;line-height:13.5pt;}
body {padding:12pt;}p {margin:0 0 3pt;}
input {display:block;width:180pt;height:13.5pt;margin:0 0 6pt;padding:1.5pt 2.25pt;border:.75pt solid #777777;background:white;color:#222222;font-family:"DejaVu Sans Mono";font-size:10.5pt;line-height:13.5pt;}
input:valid {border-color:#28613b;} input:invalid {border-color:#b53232;}
</style></head><body>
<p>Initial pattern and value state</p>
<input id=intersection pattern="[[a-z]&amp;&amp;[^aeiou]]+" value=bcdf>
<input id=subtraction pattern="[[a-z]--[aeiou]]+" value=ae>
<input id=strings pattern="[\q{abc|def}]" value=def>
<input id=emoji pattern="\p{RGI_Emoji}" value="😀" style='font-family:"DejaVu Sans"'>
<input id=anchored pattern="a" value=ba>
<input id=backref pattern="([a-z]+)\1" value=abab>
<input id=lookahead pattern="(?=abc)abc" value=abc>
<input id=lookbehind pattern="a+(?&lt;=a+)b" value=aab>
<input id=property_alias pattern="\p{Script_Extensions=Latin}+" value=Latin>
<input id=invalid_pattern pattern="[" value=Unchanged>
<input id=pattern_email type=email multiple pattern=".+@example\.test" value="a@example.test,b@example.test">
<p>Initial email and absolute URL values</p>
<input id=email_newlines type=email multiple value=" a&#10;@b , c&#13;@d ">
<input id=email_bad type=email readonly value=bad>
<input id=url_opaque type=url value=mailto:a@b>
<input id=url_special type=url value=http:example.test>
<input id=url_bad type=url value="https://[">
</body></html>
