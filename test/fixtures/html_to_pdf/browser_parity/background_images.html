<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; }
      body { font-family: "DejaVu Sans", Arial, sans-serif; }
      .sheet { width: 595pt; padding: 24pt; box-sizing: border-box; }
      .panel {
        width: 300pt;
        height: 90pt;
        margin-bottom: 16pt;
        border: 3pt solid #1f2937;
        background-color: #f8fafc;
        background-image: url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAIAAAABCAIAAAB7QOjdAAAADElEQVR4nGP4zwACAAYBAQB/9VxdAAAAAElFTkSuQmCC");
        background-size: 24pt 12pt;
        background-position: 8pt 6pt;
      }
      .repeat { background-repeat: repeat; }
      .cover {
        background-repeat: no-repeat;
        background-size: cover;
        background-position: right center;
      }
      .minimum {
        background-repeat: no-repeat;
        background-size: min(24pt, 10%);
        background-position: 8pt 6pt;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <div class="panel repeat"></div>
      <div class="panel cover"></div>
      <div class="panel minimum"></div>
    </main>
  </body>
</html>
