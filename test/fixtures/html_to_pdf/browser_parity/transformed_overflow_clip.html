@page{size:160pt 120pt;margin:0}html,body{margin:0}

.paint{height:16px;transform-origin:0 0}
</style></head><body>
<div class="frame" style="left:8px;top:8px"><div class="paint" style="width:1600px;transform:scaleX(.01);background:red"></div><div class="paint" style="width:1600px;transform:scaleX(0);background:blue"></div></div>

<div class="frame" style="left:8px;top:64px;width:48px"><div style="width:80px;height:32px;overflow:hidden;transform:translateX(16px)"><div class="paint" style="width:160px;transform:scaleX(.5);background:lime"></div></div></div>
<div class="frame" style="left:120px;top:64px;width:48px"><div class="paint" style="width:32px;transform:translateX(16px) scaleX(-1);background:red"></div></div>
</body></html>
