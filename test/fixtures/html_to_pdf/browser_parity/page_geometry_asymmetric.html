<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      @page {
        size: A5 landscape;
        margin: 18pt 30pt 24pt 42pt;
      }
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "DejaVu Sans";
        font-size: 10pt;
        line-height: 12pt;
      }
      .frame {
        height: 54pt;
        padding: 8pt;
        border: 3pt solid #1d4ed8;
        background-color: #dbeafe;
        box-sizing: border-box;
      }
      .marker {
        width: 140pt;
        height: 40pt;
        margin-top: 16pt;
        border: 2pt solid #047857;
        background-color: #d1fae5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame">A5 landscape with asymmetric page margins</div>
      <div class="marker"></div>
    </main>
  </body>
</html>
