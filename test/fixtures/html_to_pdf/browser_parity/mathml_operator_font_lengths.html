<!doctype html>
<html><head><meta charset="utf-8"><style>
@page {size:360pt 250pt;margin:0}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:12pt;line-height:24pt}
body {padding:12pt}
p {margin:0 0 12pt}
math {font-family:"STIX Two Math";font-size:20pt}
</style></head><body>
<p>Zero width <math><mn>1</mn><mo lspace="1ch" rspace="2ch">+</mo><mn>2</mn></math>.</p>
<p>Cap height <math><mn>3</mn><mo lspace="0.5cap" rspace="1cap">=</mo><mn>4</mn></math>.</p>
<p>Line height <math><mn>5</mn><mo style="line-height:24pt" lspace="0.25lh" rspace="0.5lh">+</mo><mn>6</mn></math>.</p>
<p>Core font <math style="font-size:16pt"><mn>7</mn><mrow style="font-size:28pt"><mo style="font-size:16pt" lspace="1ch" rspace="0.5cap">+</mo></mrow><mn>8</mn></math>.</p>
</body></html>
