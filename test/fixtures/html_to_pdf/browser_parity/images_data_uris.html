<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "DejaVu Sans", Arial, sans-serif;
        font-size: 9pt;
        line-height: 11pt;
        color: #111827;
      }
      .sheet { width: 612pt; padding: 20pt; box-sizing: border-box; }
      .row {
        display: flex;
        gap: 12pt;
        align-items: center;
        width: 360pt;
        padding: 8pt;
        border: 2pt solid #334155;
        background-color: #f8fafc;
      }
      img {
        display: block;
        width: 48pt;
        height: 32pt;
        padding: 3pt;
        border: 1pt solid #1d4ed8;
        background-color: #ffffff;
      }
      table {
        margin-top: 16pt;
        width: 300pt;
        border-collapse: collapse;
      }
      td {
        padding: 6pt;
        border: 1pt solid #047857;
        background-color: #ecfdf5;
      }
      .grid {
        display: grid;
        grid-template-columns: 80pt 80pt;
        gap: 8pt;
        margin-top: 16pt;
        padding: 6pt;
        border: 2pt solid #92400e;
        background-color: #fffbeb;
      }
    </style>
  </head>
