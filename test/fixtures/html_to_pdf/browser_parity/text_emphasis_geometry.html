<!doctype html><html><head><meta charset="utf-8"><style>@page{size:600pt 150pt;margin:0}html,body{margin:0;padding:0}
#text_emphasis_geometry .sample{position:absolute;top:8pt;width:180pt;padding:3pt;border:0.75pt solid #445566;box-sizing:border-box}
#text_emphasis_geometry .sample:nth-child(1){left:9pt}#text_emphasis_geometry .sample:nth-child(2){left:207pt}#text_emphasis_geometry .sample:nth-child(3){left:405pt}
#text_emphasis_geometry .label{font:8pt/12pt 'DejaVu Sans';margin:0 0 9pt}
#text_emphasis_geometry .text{font:18pt/36pt 'DejaVu Sans';margin:0;text-emphasis-color:#336699}
</style></head><body>
<section id="text_emphasis_geometry" style="position:absolute;left:0pt;top:0pt;width:600pt;height:150pt;box-sizing:border-box">
<section class="sample"><p class="label">Filled dot / ligature and mark</p><p class="text" style="text-emphasis-style:filled dot">ABC</p><p class="text" style="text-emphasis-style:filled dot">ffi<span>Á B.</span></p></section>
<section class="sample"><p class="label">Open circle / under</p><p class="text" style="text-emphasis-style:open circle;text-emphasis-position:under">ABC</p><p class="text" style="text-emphasis-style:open circle;text-emphasis-position:under">A B.</p></section>
<section class="sample"><p class="label">Custom mark / bidi</p><p class="text" style="text-emphasis-style:'*'">ABC</p><p class="text" dir="rtl" style="text-emphasis-style:'*'">אב<span>גד</span></p></section>
</section></body></html>
