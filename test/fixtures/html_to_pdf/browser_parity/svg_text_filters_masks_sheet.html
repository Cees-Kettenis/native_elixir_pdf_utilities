<!-- inline_svg_nonlinear_output_ink.html; SHA256 e981e1ff9cb0076b89b0c00c5c148ffa40a69d3a5d96b30e7b518f85b377aeb6; original 340 x 190 pt canvas -->
<section id="sample_1" style="position:absolute;left:432.0pt;top:252.0pt;width:316.0pt;height:166.0pt;box-sizing:border-box"><p>Actual nonlinear source glyph output Ω</p><svg width="400" height="150"><defs><filter id="matrix" filterUnits="userSpaceOnUse" x="0" y="0" width="120" height="55"><feColorMatrix type="saturate" values=".5"/></filter><filter id="erode" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="50"><feMorphology operator="erode" radius="6" result="ink"/><feFlood flood-color="#235296" result="background"/><feMerge><feMergeNode in="background"/><feMergeNode in="ink"/></feMerge></filter><filter id="move" filterUnits="userSpaceOnUse" x="0" y="0" width="100" height="50"><feOffset dx="50"/><feColorMatrix type="saturate" values=".5"/></filter><filter id="warp" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB" x="0" y="0" width="100" height="50"><feFlood flood-color="#ff8000" result="map"/><feDisplacementMap in="SourceGraphic" in2="map" scale="80" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g transform="translate(5 5)" filter="url(#matrix)"><text x="20" y="35" font-family="DejaVu Sans" font-size="24">AB</text><rect x="19" y="5" width="18" height="40" fill="#287445"/></g><g transform="translate(150 5)" filter="url(#erode)"><text x="10" y="25" font-family="DejaVu Sans" font-size="9">I</text></g><g transform="translate(5 85)" filter="url(#move)"><text x="-40" y="25" font-family="DejaVu Sans" font-size="18">Y</text></g><g transform="translate(150 85)" filter="url(#warp)"><text x="105" y="25" font-family="DejaVu Sans" font-size="18">Y</text></g></svg></section>

<!-- inline_svg_filter_resource_inputs.html; SHA256 30a5a622c0903b140bfcb7143c3c8a35874249d2d2447512b6f1522c3d0d7591; original 390 x 230 pt canvas -->
<section id="sample_2" style="position:absolute;left:432.0pt;top:444.0pt;width:366.0pt;height:206.0pt;box-sizing:border-box"><p>Authorized independent filter image resources</p>
<svg width="480" height="190" viewBox="0 0 480 190">
<defs>
<filter id="png" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="60"><feImage href="assets/svg-resource-colors.png" preserveAspectRatio="none"/></filter>
<filter id="nested" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="80"><feImage href="assets/svg-resource-nested.svg" preserveAspectRatio="none" result="image"/><feGaussianBlur in="image" stdDeviation=".4"/></filter>
<image id="local" href="assets/svg-resource-colors.png" width="120" height="60" preserveAspectRatio="none"/>
<filter id="local-image" filterUnits="userSpaceOnUse" x="0" y="0" width="160" height="70"><feImage href="#local"/></filter>
</defs>
<rect width="480" height="190" fill="#ececec"/>
<g transform="translate(12 10)"><rect width="160" height="60" fill="white" filter="url(#png)"/></g>
<g transform="translate(240 10)"><rect width="160" height="80" fill="white" filter="url(#nested)"/></g>
<g opacity=".7" transform="translate(12 100)"><rect width="160" height="70" fill="white" filter="url(#local-image)"/></g>
<text x="240" y="138" font-size="16" fill="#235296">Original selected text</text>
</svg></section>

<!-- inline_svg_masks.html; SHA256 d72216429ada130233f0fb2b761f7edc5eecbdc46f55a38ee2dadc8305e945a4; original 420 x 240 pt canvas -->
<section id="sample_3" style="position:absolute;left:432.0pt;top:12.0pt;width:396.0pt;height:216.0pt;box-sizing:border-box"><p>Native vector masks Ω café</p>
<svg width="480" height="180" viewBox="0 0 480 180">
<defs>
<linearGradient id="fade"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="black"/></linearGradient>
<mask id="luma" maskUnits="userSpaceOnUse" x="8" y="8" width="140" height="65"><rect x="8" y="8" width="140" height="65" fill="url(#fade)"/></mask>
<mask class="alpha" id="alpha" maskUnits="userSpaceOnUse" x="175" y="8" width="100" height="65"><circle cx="225" cy="40" r="32" fill="black" fill-opacity=".5"/></mask>
<mask id="color" maskUnits="userSpaceOnUse" x="305" y="8" width="120" height="65"><rect x="305" y="8" width="40" height="65" fill="red"/><rect x="345" y="8" width="40" height="65" fill="lime"/><rect x="385" y="8" width="40" height="65" fill="blue"/></mask>
<mask id="bbox" maskContentUnits="objectBoundingBox"><rect width=".5" height="1" fill="white"/></mask>
</defs>
<g mask="url(#luma)"><rect x="8" y="8" width="140" height="65" fill="#194f94"/><rect x="35" y="25" width="85" height="30" fill="#c52b40"/></g>
<g mask="url(#alpha)"><rect x="175" y="8" width="100" height="65" fill="#287445"/><circle cx="225" cy="40" r="22" fill="#e0c974"/></g>
<rect x="305" y="8" width="120" height="65" fill="#194f94" mask="url(#color)"/>
<rect x="8" y="102" width="140" height="45" fill="#c52b40" mask="url(#bbox)"/>
<g transform="translate(178 102) rotate(6)" mask="url(#bbox)"><rect width="110" height="45" fill="#287445"/><text x="4" y="25" font-family="DejaVu Sans" font-size="18" fill="black">café Ω</text></g>
</svg><p>Masks retained genuine selected glyphs and paint order.</p></section>
