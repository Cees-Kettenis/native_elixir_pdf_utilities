<!doctype html>
<html><head><meta charset="utf-8"><style>
@page { size:420px 390px; margin:12px; }
html,body { margin:0; padding:0; font-family:"DejaVu Sans"; font-size:12px; line-height:16px; color:#174a86; }
p { margin:0; }
body > svg { display:block; width:360px; height:88px; }
.hot { stop-color:#a03333; }
#mid { stop-color:#dd8800; }
</style></head><body>
<p>Linear gradients and host stop cascade Ω</p>
<svg viewBox="0 0 360 88"><defs>
 <linearGradient id="ramp"><stop offset="0" class="hot"/><stop id="mid" offset="40%" stop-color="black"/><stop offset="1" stop-color="#168250"/></linearGradient>
 <linearGradient id="user" gradientUnits="userSpaceOnUse" x1="130" y1="0" x2="220" y2="70"><stop offset="0" stop-color="#174a86"/><stop offset="1" stop-color="#dd8800"/></linearGradient>
 <linearGradient id="angled" gradientTransform="rotate(25 .5 .5)"><stop offset="0" stop-color="#174a86"/><stop offset="1" stop-color="#a03333"/></linearGradient>
</defs><rect x="4" y="4" width="104" height="76" fill="url(#ramp)"/><rect x="124" y="4" width="104" height="76" fill="url(#user)"/><rect x="244" y="4" width="104" height="76" fill="url(#angled)" rx="12"/></svg>
<p>Radial gradients with elliptical bounds and focal points</p>
<svg viewBox="0 0 360 88"><defs>
 <radialGradient id="disk"><stop offset="0" stop-color="#dd8800"/><stop offset="1" stop-color="#174a86"/></radialGradient>
 <radialGradient id="focus" fx="25%" fy="30%"><stop offset="0" stop-color="#dd8800"/><stop offset=".5" stop-color="#168250"/><stop offset="1" stop-color="#174a86"/></radialGradient>
 <radialGradient id="user-disk" gradientUnits="userSpaceOnUse" cx="296" cy="42" r="40" fx="286" fy="32"><stop offset="0" stop-color="white"/><stop offset="1" stop-color="#a03333"/></radialGradient>
</defs><ellipse cx="56" cy="42" rx="52" ry="36" fill="url(#disk)"/><rect x="124" y="4" width="104" height="76" fill="url(#focus)"/><circle cx="296" cy="42" r="36" fill="url(#user-disk)"/></svg>
<p>Gradient strokes, compound fills and opacity café</p>
<svg viewBox="0 0 360 88"><defs>
 <linearGradient id="alpha"><stop offset="0" stop-color="#a03333" stop-opacity=".5"/><stop offset="1" stop-color="#174a86" stop-opacity=".5"/></linearGradient>
 <linearGradient id="stroke"><stop offset="0" stop-color="#168250"/><stop offset="1" stop-color="#dd8800"/></linearGradient>
</defs><path d="M4 4H108V80H4Z M26 22H84V62H26Z" fill="url(#alpha)" fill-rule="evenodd"/><path d="M130 65C135 5 210 5 220 65" fill="none" stroke="url(#stroke)" stroke-width="9" stroke-linecap="round" stroke-dasharray="12 5"/><g transform="translate(244 4) rotate(8 50 38)" opacity=".6"><rect width="100" height="76" fill="url(#alpha)"/><circle cx="50" cy="38" r="24" fill="url(#stroke)"/></g></svg>
<p>Gradient artwork survived</p>
</body></html>
