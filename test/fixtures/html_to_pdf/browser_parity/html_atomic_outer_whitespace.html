<!doctype html>
<meta charset="utf-8">
<style>
  @page { size: 300px 300px; margin: 12px; }
  body { margin: 0; font-family: "DejaVu Sans"; font-size: 16px; line-height: 20px; }
  p { margin: 0 0 12px; width: 120px; }
  span { display: inline-block; width: 80px; background: #edf2f8; }
  .first { white-space: pre; }
  .second { white-space: nowrap; }
  .nowrap { white-space: nowrap; }
</style>
<p><span class="first">First</span> <span class="second">Second</span></p>
<p class="nowrap"><span class="first">Third</span> <span class="second">Fourth</span></p>
