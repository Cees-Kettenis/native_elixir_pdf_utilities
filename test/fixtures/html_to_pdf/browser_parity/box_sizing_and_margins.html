<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        font-family: "DejaVu Sans", Arial, sans-serif;
        font-size: 10pt;
        line-height: 12pt;
        color: #111827;
      }
      .sheet { width: 595pt; padding: 24pt; box-sizing: border-box; }
      .content-box {
        box-sizing: content-box;
        width: 160pt;
        min-width: 140pt;
        max-width: 190pt;
        min-height: 38pt;
        margin: 8pt 0 0 12pt;
        padding: 8pt 12pt;
        border: 3pt solid #4f46e5;
        background-color: #eef2ff;
      }
      .border-box {
        box-sizing: border-box;
        width: 210pt;
        min-height: 42pt;
        margin: -4pt 0 0 36pt;
        padding: 8pt;
        border: 4pt solid #0f766e;
        background-color: #ccfbf1;
      }
      .clamped {
        width: 80%;
        max-width: 260pt;
        min-height: 24pt;
        margin-top: 14pt;
        padding: 5pt;
        border: 1pt solid #92400e;
        background-color: #fef3c7;
      }
      .percentage-parent { width: 300pt; margin-top: 14pt; }
      .percentage-parent > div {
        width: 50%;
        margin: 4pt 10pt 0 10pt;
        padding: 4pt 10pt;
        border: 2pt solid #334155;
      }
      .percentage-content { box-sizing: content-box; background-color: #dbeafe; }
      .percentage-border { box-sizing: border-box; background-color: #dcfce7; }
      .percentage-flex { display: flex; box-sizing: content-box; background-color: #fce7f3; }
      .percentage-grid { display: grid; box-sizing: border-box; background-color: #ede9fe; }
      .constraint-conflicts { width: 300pt; margin-top: 14pt; }
      .conflict-width {
        width: 120pt;
        min-width: 180pt;
        max-width: 80pt;
        height: 20pt;
        background-color: #fee2e2;
      }
      .conflict-percent {
        width: 50%;
        min-width: 75%;
        max-width: 25%;
        height: 20pt;
        background-color: #dbeafe;
      }
      .conflict-height {
        width: 180pt;
        height: 18pt;
        min-height: 32pt;
        max-height: 10pt;
        background-color: #dcfce7;
      }
    </style>
  </head>
  <body>
    <main class="sheet">
      <section class="content-box">content box sizing</section>
      <section class="border-box">border box with negative margin</section>
      <section class="clamped">percentage width with max width</section>
      <section class="percentage-parent">
        <div class="percentage-content">content-box percentage</div>
        <div class="percentage-border">border-box percentage</div>
        <div class="percentage-flex">flex percentage</div>
        <div class="percentage-grid">grid percentage</div>
      </section>
      <section class="constraint-conflicts">
        <div class="conflict-width">minimum width wins</div>
        <div class="conflict-percent">percentage minimum wins</div>
        <div class="conflict-height">minimum height wins</div>
      </section>
    </main>
  </body>
</html>
