<!doctype html><html lang=en-US><head><style>
@page {size:300pt 520pt;margin:0;}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:10.5pt;line-height:15pt;}
body {padding:12pt;}p {margin:0 0 9pt;}input {display:block;width:78pt;height:30pt;}
</style></head><body>
<p>Original angle cancellation<input type=color value="hsl(calc(120deg / 1deg) 100% 50%)"></p>
<p>Percentage cancellation<input type=color value="rgb(calc(25% / 5%) 20 30)"></p>
<p>Dimensional product<input type=color value="hsl(calc(120deg * 1deg / 1deg) 100% 50%)"></p>
<p>Scalar angle division<input type=color value="hsl(calc(240deg / 2) 100% 50%)"></p>
<p>Scalar angle multiplication<input type=color value="hsl(calc(2 * 60deg) 100% 50%)"></p>
<p>Inverse tangent hue<input type=color value="hsl(atan2(1,0) 100% 50%)"></p>
<p>Scaled percentages<input type=color value="rgb(calc(2 * 10%) 20% 30%)"></p>
<p>After dimensional calculations</p>
</body></html>
