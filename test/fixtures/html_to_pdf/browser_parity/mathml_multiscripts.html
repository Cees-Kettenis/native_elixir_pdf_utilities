<!doctype html><html><head><meta charset="utf-8"><style>
@page {size:420pt 700pt;margin:0}
html,body {margin:0;padding:0;font-family:"DejaVu Sans";font-size:12pt;line-height:18pt}
body {padding:12pt}
p {margin:0 0 4pt;line-height:44pt}
math {font-family:"STIX Two Math";font-size:18pt}
</style></head><body>
<p>Pair <math><mmultiscripts><mn>7</mn><mn>1</mn><mn>2</mn></mmultiscripts></math> end.</p>
<p>Post <math><mmultiscripts><mn>7</mn><mn>1</mn><mn>2</mn><mn>3</mn><mn>4</mn></mmultiscripts></math> end.</p>
<p>Pre <math><mmultiscripts><mn>7</mn><mprescripts/><mn>12</mn><mn>3</mn></mmultiscripts></math> end.</p>
<p>Both <math><mmultiscripts><mi>α</mi><mn>1</mn><mn>2</mn><mprescripts/><mi>β</mi><mn>3</mn></mmultiscripts></math> end.</p>
<p>Empty <math><mmultiscripts><mn>7</mn><mrow/><mn>2</mn><mprescripts/><mn>3</mn><mrow/></mmultiscripts></math> end.</p>
<p>Corner <math><mmultiscripts><mi>f</mi><mn>1</mn><mn>2</mn><mprescripts/><mn>3</mn><mn>4</mn></mmultiscripts></math> end.</p>
<p>Large <math><mmultiscripts><mo>∑</mo><mn>1</mn><mn>2</mn><mprescripts/><mn>3</mn><mn>4</mn></mmultiscripts></math> end.</p>
<p>Nested <math><mmultiscripts><mn>7</mn><msub><mn>1</mn><mn>2</mn></msub><mn>3</mn><mprescripts/><mn>4</mn><msup><mn>5</mn><mn>6</mn></msup></mmultiscripts></math> end.</p>
<p>Tall <math><mmultiscripts><mn>7</mn><mn>1</mn><mn>2</mn><mspace height="23pt"/><mn>4</mn></mmultiscripts></math> end.</p>
<p>Odd <math><mmultiscripts><mn>7</mn><mn>1</mn></mmultiscripts></math> end.</p>
<p>Duplicate <math><mmultiscripts><mn>7</mn><mprescripts/><mprescripts/></mmultiscripts></math> end.</p>
<p>Marker <math><mmultiscripts><mn>7</mn><mprescripts><mn>8</mn></mprescripts></mmultiscripts></math> end.</p>
<p>Standalone <math><mprescripts><mn>8</mn><mn>9</mn></mprescripts></math> end.</p>
</body></html>
