<!doctype html><html lang=en><head><style>
@page{size:240pt 400pt;margin:0}html,body{margin:0;padding:0;font-family:"DejaVu Sans";font-size:10pt}body{padding:12pt}p{margin:0 0 6pt}select{display:block;font-family:"DejaVu Sans";font-size:10pt;width:130pt;margin:0 0 10pt}
</style></head><body>
<p>Changed selection</p><select name=changed size=3><option value=a>Alpha</option><option value=b>Beta</option><option value=c selected>Gamma</option></select>
<p>Cleared selection</p><select name=cleared size=3 multiple><option value=a>Alpha</option><option value=b>Beta</option><option value=c>Gamma</option></select>
<p>Multiple selections</p><select name=multiple size=3 multiple><option value=a selected>Alpha</option><option value=b style="font-style:italic;color:rgba(255,0,0,.5);background:#ffffaa">Beta</option><option value=c selected>Gamma</option></select>
<p>Scrolled selection</p><select name=scrolled size=2><option value=a>Alpha</option><option value=b>Beta</option><option value=c>Gamma</option><option value=d>Delta</option><option value=e selected>Epsilon</option></select>
<p>Empty padded options</p><select name=empty size=3 style="padding:4pt"><option value=a></option><option value=b></option><option value=c selected></option></select>
</body></html>
