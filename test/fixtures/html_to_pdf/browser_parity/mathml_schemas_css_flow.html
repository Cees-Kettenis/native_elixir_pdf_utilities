<!doctype html><html><head><meta charset="utf-8"><style>
@page {size:360pt 360pt;margin:0}

p {margin:0 0 8pt;line-height:56pt}

<p>Children <math><mfrac style="display:block;padding:0"><mn style="math-depth:0;font-size:20pt">12</mn><mn style="math-depth:0;font-size:20pt">34</mn></mfrac></math> end.</p>
