<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:600pt 120pt;margin:0}html,body{margin:0;padding:0}
#vertical_synthesized_metrics .sample{position:absolute;top:0;width:300pt;height:120pt}
#vertical_synthesized_metrics .caption{position:absolute;left:9pt;top:9pt;font:8pt/12pt 'DejaVu Sans'}
#vertical_synthesized_metrics .probe{position:absolute;left:42pt;top:27pt;margin:0;width:72pt;height:84pt;font:12pt/36pt 'DejaVu Sans';writing-mode:vertical-rl;text-orientation:upright;color:#336699}
#vertical_synthesized_metrics .context{font-family:'Authored Contextual Vertical';font-size:18pt;text-orientation:mixed}
</style></head><body>
<!-- CSS Writing Modes 4, section 5.1.2: Tr characters remain upright when a
     vertical alternate is absent. A contextual vert lookup needs both characters.
     The existing DejaVu face has no vertical tables; the other face is built in memory.
     Both cases share the existing capture and add no font asset or browser launch. -->
<section id="vertical_synthesized_metrics" style="position:absolute;left:0pt;top:0pt;width:600pt;height:120pt;box-sizing:border-box">
<section class="sample" style="left:0pt"><span class="caption">Synthesized advances and origins</span><p class="probe">AB</p></section>
<section class="sample" style="left:300pt"><span class="caption">Contextual vertical alternate</span><p class="probe context">（（</p></section>
</section></body></html>
