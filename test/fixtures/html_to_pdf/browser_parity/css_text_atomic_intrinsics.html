<!doctype html><html><head><style>
@page {size:240pt 240pt;margin:12pt}
html,body {margin:0;font-family:'DejaVu Sans';font-size:12pt;line-height:18pt}
table {width:30pt;border-spacing:0;margin-bottom:12pt;background:#dce8f6}
td {padding:0}
.box {display:inline-block;width:72pt;background:#e8d8bd}
</style></head><body>
<table><tr><td><span class="box">Box</span>Z</td></tr></table>
<table style="overflow-wrap:anywhere"><tr><td><span class="box">Box</span>ABCDE</td></tr></table>
<table style="overflow-wrap:break-word"><tr><td><span class="box">Box</span>ABCDE</td></tr></table>
<table style="word-break:break-word"><tr><td><span class="box">Box</span>ABCDE</td></tr></table>
</body></html>
