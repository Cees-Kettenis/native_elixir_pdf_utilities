<!doctype html>
<html><head><meta charset="utf-8"><style>
@page { size: 420pt 270pt; margin: 12pt; }
body { margin: 0; font-family: 'DejaVu Sans'; font-size: 12pt; }
p { margin: 0 0 8pt; }
svg { display: block; }
.card { font-size: 14px; color: #194f94; background-color: #e0c974; padding: 4px; }
.card strong { color: #c52b40; }
</style></head><body><p>Actual HTML filter inputs café Ω</p>
<svg width="480" height="210" viewBox="0 0 480 210">
<defs>
<filter id="shadow" x="-20%" y="-30%" width="140%" height="160%"><feDropShadow dx="3" dy="3" stdDeviation="2" flood-color="#18263a" flood-opacity=".5"/></filter>
<filter id="matrix"><feColorMatrix type="saturate" values=".3"/></filter>
<clipPath id="clip"><rect x="8" y="8" width="190" height="80"/></clipPath>
</defs>
<g filter="url(#shadow)" clip-path="url(#clip)"><foreignObject x="12" y="12" width="175" height="64"><div xmlns="http://www.w3.org/1999/xhtml" class="card">HTML <strong>selected café Ω</strong><br/>Two native lines</div></foreignObject></g>
<rect x="140" y="57" width="58" height="15" fill="#287445"/>
<g transform="translate(245 15) rotate(8)" filter="url(#matrix)"><foreignObject width="145" height="68"><div xmlns="http://www.w3.org/1999/xhtml" class="card">Rotated HTML<br/><strong>Genuine glyphs</strong></div></foreignObject></g>
<foreignObject x="12" y="110" width="180" height="72"><div xmlns="http://www.w3.org/1999/xhtml" class="card">Ordinary vector HTML<br/>Original CID glyphs</div></foreignObject>
<g opacity=".6" filter="url(#shadow)"><foreignObject x="235" y="110" width="150" height="65"><div xmlns="http://www.w3.org/1999/xhtml" class="card">Actual HTML opacity<br/><strong>Filter paint order</strong></div></foreignObject><rect x="330" y="146" width="50" height="12" fill="#194f94"/></g>
</svg><p>Painted HTML supplies every SourceGraphic.</p></body></html>
