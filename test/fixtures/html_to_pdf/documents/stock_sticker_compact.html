<!doctype html>

    <title>Synthetic compact stock stickers</title>
    <style>
      @page { size: 5cm 3cm; margin: 0; }
      html,
      body {
        font-family: "Liberation Sans", sans-serif;
        box-sizing: border-box;
        height: 3cm;
        width: 5cm;
        margin: 0;
        padding: 0;
      }

      .container {
        break-after: always;
        box-sizing: border-box;
        height: 3cm;
        width: 5cm;
        padding: 0.5mm;
        overflow: hidden;
        font-size: 9px;
        line-height: 1.05;
      }

      .primary-details {
        display: flex;
        height: 17mm;
        min-height: 17mm;
      }

      .primary-details img {
        flex: 0 0 14.5mm;
        width: 14.5mm;
        height: 14.5mm;
      }

      .primary-text {
        box-sizing: border-box;
        width: 34.5mm;
        padding-left: 0.8mm;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .primary-text div {
        margin-bottom: 0.2mm;
      }

      .secondary-details {
        box-sizing: border-box;
        height: 12mm;
        padding-top: 0.5mm;
        display: flex;
        flex-wrap: wrap;
        overflow: hidden;
      }

      .secondary-details div {
        box-sizing: border-box;
        width: 50%;
        height: 3.7mm;
        padding-right: 0.5mm;
        overflow: hidden;
        overflow-wrap: anywhere;
      }

      .secondary-details .date {
        width: 60%;
      }

      .secondary-details .size {
        width: 40%;
      }

      .secondary-details .wide {
        width: 100%;
      }
    </style>
  </head>
