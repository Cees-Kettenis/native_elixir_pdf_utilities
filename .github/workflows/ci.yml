name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
      jobs: ${{ steps.runtimes.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6

      - name: Test quality matrix orchestration
        run: ./scripts/test-quality-matrix

      - name: Load supported runtimes
        id: runtimes
        run: |
          matrix="$(./scripts/quality-matrix --matrix-json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jobs="$(printf '%s' "${matrix}" | jq -c '{include: [.include[] as $runtime | $runtime + {suite: "checks"}, $runtime + {suite: "parity"}]}')"
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"

  runtime-checks:
    name: Elixir ${{ matrix.elixir }} ${{ matrix.suite }}
    needs: runtime-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.jobs) }}
    container:
      image: ${{ matrix.image }}
    env:
      MIX_ENV: test
      CHROMIUM_BIN: /usr/bin/chromium
    steps:
      - uses: actions/checkout@v6

      - name: Verify container runtime
        id: runtime
        run: |
          elixir --version
          elixir --version | grep -F "Elixir ${{ matrix.elixir }}."
          runtime_id="$(elixir -e 'IO.write("#{System.version()}-erts-#{:erlang.system_info(:version)}")')"
          echo "cache-key=${runtime_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify browser comparison tools
        run: |
          for tool in chromium pdftoppm pdftotext pdffonts fc-match; do
            command -v "$tool"
          done

      - name: Restore Mix and Dialyzer caches
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          key: mix-elixir-${{ steps.runtime.outputs.cache-key }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-elixir-${{ steps.runtime.outputs.cache-key }}-

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          # Hex bootstrap and package downloads can fail transiently. Retry only
          # dependency acquisition; compilation and tests must pass on one run.
          for attempt in 1 2 3; do
            if mix deps.get; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "Dependency acquisition failed on attempt $attempt; retrying." >&2
            sleep "$((attempt * 5))"
          done

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile project with warnings as errors
        run: mix compile --warnings-as-errors

      # Ordinary checks and complete parity suites have independent runners.
      # The newest supported minor owns coverage, Dialyzer and performance.
      - name: Check formatting and dependencies
        if: matrix.suite == 'checks' && matrix.canonical
        run: |
          mix format --check-formatted
          mix deps.unlock --check-unused

      - name: Run tests on compatibility runtimes
        if: matrix.suite == 'checks' && !matrix.canonical
        run: mix test --warnings-as-errors

      - name: Run tests and enforce 100% coverage
        if: matrix.suite == 'checks' && matrix.canonical
        run: mix test --cover --warnings-as-errors

      - name: Run Dialyzer
        if: matrix.suite == 'checks' && matrix.canonical
        run: mix dialyzer --no-compile

      - name: Run Chromium browser parity tests
        id: browser-parity
        if: matrix.suite == 'parity'
        run: env -u MIX_TEST_PARTITION mix test.browser_parity --warnings-as-errors

      - name: Check performance against recorded baselines
        if: matrix.suite == 'checks' && matrix.canonical
        env:
          PERFORMANCE_REPORT: .quality/performance/ci.json
          PERFORMANCE_REVISION: ${{ github.sha }}
        run: ./scripts/check-performance

      - name: Upload performance report
        if: always() && matrix.suite == 'checks' && matrix.canonical
        uses: actions/upload-artifact@v7
        with:
          name: performance-report-elixir-${{ matrix.elixir }}
          path: .quality/performance/ci.json
          retention-days: 7

      - name: Upload coverage report
        if: always() && matrix.suite == 'checks' && matrix.canonical
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-elixir-${{ matrix.elixir }}
          path: cover
          retention-days: 7

      - name: Upload failed browser parity artifacts
        if: failure() && steps.browser-parity.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-artifacts-elixir-${{ matrix.elixir }}
          path: |
            tmp/browser_parity
            tmp/test_artifacts
          retention-days: 7

      - name: Summarize browser parity work
        if: always() && (steps.browser-parity.outcome == 'success' || steps.browser-parity.outcome == 'failure')
        run: |
          mkdir -p .quality/browser-parity
          mix run --no-start --no-compile scripts/browser-parity-report.exs .quality/browser-parity > .quality/browser-parity/report.json

      - name: Upload browser parity telemetry
        if: always() && matrix.suite == 'parity'
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-telemetry-elixir-${{ matrix.elixir }}
          path: .quality/browser-parity
          retention-days: 7

  # Keep the existing required check names, and never report success if a
  # suite failed, was cancelled or did not run.
  supported-elixir:
    name: Elixir ${{ matrix.elixir }}
    needs: [runtime-matrix, runtime-checks]
    if: always() && needs.runtime-matrix.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.matrix) }}
    steps:
      - name: Require all runtime checks and complete browser suites
        env:
          RESULT: ${{ needs.runtime-checks.result }}
        run: test "${RESULT}" = success
