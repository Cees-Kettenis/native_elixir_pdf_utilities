name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.runtimes.outputs.matrix }}
      jobs: ${{ steps.runtimes.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6

      - name: Test quality matrix orchestration
        run: ./scripts/test-quality-matrix

      - name: Load supported runtimes
        id: runtimes
        run: |
          matrix="$(./scripts/quality-matrix --matrix-json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          jobs="$(printf '%s' "${matrix}" | jq -c '{include: [.include[] as $runtime | $runtime + {suite: "checks"}, $runtime + {suite: "parity"}]}')"
          echo "jobs=${jobs}" >> "${GITHUB_OUTPUT}"

  runtime-checks:
    name: Elixir ${{ matrix.elixir }} ${{ matrix.suite }}
    needs: runtime-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.jobs) }}
    container:
      image: ${{ matrix.image }}
      options: --tmpfs /browser-profiles:rw,noexec,nosuid,size=128m,mode=1777
    env:
      MIX_ENV: test
      CHROMIUM_BIN: /usr/bin/chromium
      CHROMIUM_PROFILE_ROOT: /browser-profiles
    steps:
      - uses: actions/checkout@v6

      - name: Verify container runtime
        id: runtime
        run: |
          elixir --version
          elixir --version | grep -F "Elixir ${{ matrix.elixir }}."
          runtime_id="$(elixir -e 'IO.write("#{System.version()}-erts-#{:erlang.system_info(:version)}")')"
          echo "cache-key=${runtime_id}" >> "${GITHUB_OUTPUT}"

      - name: Verify browser comparison tools
        run: |
          for tool in chromium pdftoppm pdftotext pdffonts fc-match; do
            command -v "$tool"
          done

      - name: Identify browser toolchain
        id: browser-toolchain
        if: matrix.suite == 'parity'
        shell: bash
        env:
          JOB_CONTAINER_ID: ${{ job.container.id }}
          SVG_INPUTS: ${{ hashFiles('lib/**/*svg*.ex', 'test/support/**', 'test/fixtures/html_to_pdf/svg/**', 'test/html_to_pdf/browser_parity/svg_converter_discrepancy_browser_parity_test.exs', 'test/test_helper.exs', 'mix.exs', 'mix.lock', 'ci/runtime-matrix.json', 'scripts/quality-matrix', '.github/workflows/ci.yml') }}
          BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          image_id="$(curl --fail --silent --show-error --unix-socket /var/run/docker.sock "http://localhost/containers/${JOB_CONTAINER_ID}/json" |
            elixir -e 'image = IO.read(:stdio, :eof) |> :json.decode() |> Map.fetch!("Image"); true = Regex.match?(~r/^sha256:[a-f0-9]{64}$/, image); IO.write(image)')"
          echo "BROWSER_PARITY_TOOLCHAIN=${image_id}" >> "${GITHUB_ENV}"
          echo "BROWSER_PARITY_CACHE=${GITHUB_WORKSPACE}/.quality/browser-reference-cache/elixir-${{ matrix.elixir }}" >> "${GITHUB_ENV}"
          image_key="browser-references-v2-${{ matrix.elixir }}-${image_id#sha256:}-"
          echo "image-key=${image_key}" >> "${GITHUB_OUTPUT}"
          echo "base-key=${image_key}${SVG_INPUTS}-${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head-key=${image_key}${SVG_INPUTS}-${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      # Entries verify source bytes, resources, fonts and rendering options again
      # after restoration. The test cache evicts entries above 64 MiB per runtime.
      - name: Restore browser references
        id: browser-references
        if: matrix.suite == 'parity'
        uses: actions/cache/restore@v5
        with:
          path: .quality/browser-reference-cache/elixir-${{ matrix.elixir }}
          key: ${{ steps.browser-toolchain.outputs.head-key }}
          restore-keys: |
            ${{ steps.browser-toolchain.outputs.base-key }}
            ${{ steps.browser-toolchain.outputs.image-key }}

      - name: Restore Mix and Dialyzer caches
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
            priv/plts
          # Parity must not claim the checks archive before Dialyzer saves its PLT.
          key: mix-v2-${{ matrix.suite }}-elixir-${{ steps.runtime.outputs.cache-key }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-v2-${{ matrix.suite }}-elixir-${{ steps.runtime.outputs.cache-key }}-
            mix-elixir-${{ steps.runtime.outputs.cache-key }}-

      - name: Install dependencies
        timeout-minutes: 10
        shell: bash
        run: |
          # Hex bootstrap and package downloads can fail transiently. Retry only
          # dependency acquisition; compilation and tests must pass on one run.
          for attempt in 1 2 3; do
            if mix deps.get; then
              exit 0
            else
              status=$?
            fi
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi
            echo "Dependency acquisition failed on attempt $attempt; retrying." >&2
            sleep "$((attempt * 5))"
          done

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile project with warnings as errors
        run: mix compile --warnings-as-errors

      # Ordinary checks and complete parity suites have independent runners.
      # The newest supported minor owns coverage, Dialyzer and performance.
      - name: Check formatting and dependencies
        if: matrix.suite == 'checks' && matrix.canonical
        run: |
          mix format --check-formatted
          mix deps.unlock --check-unused

      - name: Run tests on compatibility runtimes
        if: matrix.suite == 'checks' && !matrix.canonical
        run: mix test --warnings-as-errors

      - name: Run tests and enforce 100% coverage
        if: matrix.suite == 'checks' && matrix.canonical
        run: mix test --cover --warnings-as-errors

      - name: Run development app route tests
        if: matrix.suite == 'checks' && matrix.canonical
        working-directory: dev/manual_web
        run: |
          mix deps.get
          mix test --warnings-as-errors

      - name: Run Dialyzer
        if: matrix.suite == 'checks' && matrix.canonical
        run: mix dialyzer --no-compile

      - name: Run Chromium browser parity tests
        id: browser-parity
        if: matrix.suite == 'parity'
        env:
          SVG_DISCREPANCY_REPEATS: ${{ steps.browser-references.outputs.cache-matched-key == steps.browser-toolchain.outputs.base-key && 'representative' || 'all' }}
        run: env -u MIX_TEST_PARTITION mix test.browser_parity --warnings-as-errors

      - name: Save browser references
        if: matrix.suite == 'parity' && steps.browser-references.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .quality/browser-reference-cache/elixir-${{ matrix.elixir }}
          key: ${{ steps.browser-toolchain.outputs.head-key }}

      - name: Check performance against recorded baselines
        if: matrix.suite == 'checks' && matrix.canonical
        env:
          PERFORMANCE_REPORT: .quality/performance/ci.json
          PERFORMANCE_REVISION: ${{ github.sha }}
        run: ./scripts/check-performance

      - name: Upload performance report
        if: always() && matrix.suite == 'checks' && matrix.canonical
        uses: actions/upload-artifact@v7
        with:
          name: performance-report-elixir-${{ matrix.elixir }}
          path: .quality/performance/ci.json
          retention-days: 7

      - name: Upload coverage report
        if: always() && matrix.suite == 'checks' && matrix.canonical
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-elixir-${{ matrix.elixir }}
          path: cover
          retention-days: 7

      - name: Upload failed browser parity artifacts
        if: failure() && steps.browser-parity.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-artifacts-elixir-${{ matrix.elixir }}
          path: |
            tmp/browser_parity
            tmp/test_artifacts
          retention-days: 7

      - name: Summarize browser parity work
        if: always() && (steps.browser-parity.outcome == 'success' || steps.browser-parity.outcome == 'failure')
        run: |
          mkdir -p .quality/browser-parity
          mix run --no-start --no-compile scripts/browser-parity-report.exs .quality/browser-parity > .quality/browser-parity/report.json
          elixir -e 'report = File.read!(".quality/browser-parity/report.json") |> :json.decode(); IO.puts("Browser reference cache: #{inspect(report["reference_cache"])}")' | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Upload browser parity telemetry
        if: always() && matrix.suite == 'parity'
        uses: actions/upload-artifact@v7
        with:
          name: browser-parity-telemetry-elixir-${{ matrix.elixir }}
          path: .quality/browser-parity
          retention-days: 7

  # Keep the existing required check names, and never report success if a
  # suite failed, was cancelled or did not run.
  supported-elixir:
    name: Elixir ${{ matrix.elixir }}
    needs: [runtime-matrix, runtime-checks]
    if: always() && needs.runtime-matrix.result == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.runtime-matrix.outputs.matrix) }}
    steps:
      - name: Require all runtime checks and complete browser suites
        env:
          RESULT: ${{ needs.runtime-checks.result }}
        run: test "${RESULT}" = success
